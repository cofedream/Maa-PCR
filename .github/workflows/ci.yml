name: Windows Build and Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.16'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.101'
      - name: Install Locked Test Dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Public Tests
        run: |
          New-Item -ItemType Directory -Force .runtime/ci | Out-Null
          python -X utf8 -B -m pytest -p scripts.public_test_policy -m "not private_replay" --basetemp .runtime/ci/test-temp --junitxml .runtime/ci/public-tests.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Portable Candidate
        run: |
          @'
          import hashlib, sys, zipfile
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from build_release import CRT_FILES, R51_MANIFEST_SHA256, digest, download, maintenance
          baseline = Path('delivery/baselines/r51-package-manifest.json')
          if digest(baseline) != R51_MANIFEST_SHA256:
              raise ValueError('R51_crt_baseline_manifest_mismatch')
          rows = maintenance._rows(maintenance._read_json(baseline))
          archive = download({'url': 'https://github.com/shiwandehongbai/Maa-PCR/releases/download/v0.1.7/Maa-PCR-v0.1.7-win-x64.zip',
                              'sha256': 'bc6d844e2dba47d6ce6305c64812ff5a71ac449e822388e9bde2f218dc546db3'}, Path('.runtime/downloads'))
          with zipfile.ZipFile(archive) as source:
              if hashlib.sha256(source.read(maintenance.MANIFEST)).hexdigest() != R51_MANIFEST_SHA256:
                  raise ValueError('R51_crt_archive_manifest_mismatch')
              target = Path('.runtime/ci/vc-redist-r51')
              target.mkdir(parents=True, exist_ok=False)
              for name in CRT_FILES:
                  relative = 'runtime/python/' + name
                  data = source.read(relative)
                  if len(data) != rows[relative]['size'] or hashlib.sha256(data).hexdigest() != rows[relative]['sha256']:
                      raise ValueError('R51_crt_payload_mismatch: ' + name)
                  (target / name).write_bytes(data)
          '@ | python -X utf8 -B -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -X utf8 -B scripts/build_release.py --output .runtime/ci/build --base-manifest delivery/baselines/r52-package-manifest.json --vc-redist .runtime/ci/vc-redist-r51
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: GUI Update Contract Checks
        run: |
          $evidence = [IO.Path]::GetFullPath((Join-Path (Get-Location) '.runtime/ci/gui-checks'))
          dotnet run --project gui/MFAAvalonia/PcrUpdate.Tests/PcrUpdate.Tests.csproj --configuration Release --runtime win-x64 -p:Platform=x64 -p:RestorePackagesWithLockFile=true -p:RestoreLockedMode=true -p:UsedAvaloniaProducts= -- $evidence | Tee-Object -FilePath .runtime/ci/gui-checks.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Labyrinth GUI Contract Checks
        run: |
          $evidence = [IO.Path]::GetFullPath((Join-Path (Get-Location) '.runtime/ci/labyrinth-checks'))
          $source = [IO.Path]::GetFullPath((Get-Location).Path)
          $core = [IO.Path]::GetFullPath((Join-Path (Get-Location) '.runtime/ci/build/player/libs'))
          $native = [IO.Path]::GetFullPath((Join-Path (Get-Location) '.runtime/ci/build/player/runtimes/win-x64/native'))
          dotnet run --project gui/MFAAvalonia/PcrLabyrinthCredentials.Tests/PcrLabyrinthCredentials.Tests.csproj --configuration Release -p:PcrCoreDirectory=$core -p:PcrNativeDirectory=$native -p:RestorePackagesWithLockFile=true -p:RestoreLockedMode=true -- $evidence $source | Tee-Object -FilePath .runtime/ci/credentials-checks.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $python = (Get-Command python).Source
          dotnet run --project gui/MFAAvalonia/PcrProfileSwitch.Tests/PcrProfileSwitch.Tests.csproj --configuration Release -p:PcrCoreDirectory=$core -p:PcrNativeDirectory=$native -p:RestorePackagesWithLockFile=true -p:RestoreLockedMode=true -- $source $evidence $python | Tee-Object -FilePath .runtime/ci/profile-checks.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Bundled Runtime Checks
        run: |
          $env:PCR_PLAYER_PACKAGE_ROOT = [IO.Path]::GetFullPath((Join-Path $env:GITHUB_WORKSPACE '.runtime/ci/build/player'))
          $env:PCR_PLAYER_PACKAGE_ALIAS = $env:PCR_PLAYER_PACKAGE_ROOT
          python -X utf8 -B -m pytest tests/test_player_candidate.py::test_packaged_runtime_ignores_external_python_environment tests/test_player_candidate.py::test_packaged_native_crt_loads_from_python_directory tests/test_player_candidate.py::test_native_entry_uses_bundled_runtime --basetemp .runtime/ci/bundled-runtime-temp --junitxml .runtime/ci/bundled-runtime.xml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish Build Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-and-tests
          include-hidden-files: true
          retention-days: 30
          path: |
            .runtime/ci/public-tests.xml
            .runtime/ci/bundled-runtime.xml
            .runtime/ci/bundled-runtime-temp/
            .runtime/ci/gui-checks.log
            .runtime/ci/credentials-checks.log
            .runtime/ci/profile-checks.log
            .runtime/ci/build/*.json
            .runtime/ci/build/*.log
            .runtime/ci/build/Maa-PCR-*-win-x64.zip
            .runtime/ci/build/Maa-PCR-*-source.zip
            .runtime/ci/build/Maa-PCR-R*-to-R*.patch.zip
          if-no-files-found: warn
  source-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .github/gitleaks.toml
          GITLEAKS_VERSION: 8.24.3
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
